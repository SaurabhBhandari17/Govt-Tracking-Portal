<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Govt Tracking Portal - Loom Solar</title>

    <!-- Loom Solar Browser Favicon Logo -->
    <link rel="icon" type="image/png"
        href="https://www.loomsolar.com/cdn/shop/files/Loom_logo_f50a89a5-291b-4c15-9a87-303dc061554e_140x@2x.png?v=1752208604">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- FontAwesome for additional icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
        }

        .bg-grid {
            background-size: 24px 24px;
            background-image:
                linear-gradient(to right, rgba(0, 176, 80, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 176, 80, 0.04) 1px, transparent 1px);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        .orb-1 {
            top: -50px;
            left: -50px;
            width: 250px;
            height: 250px;
            background: rgba(16, 185, 129, 0.12);
        }

        .orb-2 {
            top: 200px;
            right: -50px;
            width: 300px;
            height: 300px;
            background: rgba(5, 150, 105, 0.08);
        }

        .white-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.03);
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                opacity: 0.6;
                transform: scale(0.95);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        .live-dot {
            animation: pulse-glow 2s infinite ease-in-out;
        }
    </style>
</head>

<body class="bg-grid relative overflow-x-hidden w-full">

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- LOGIN MODAL -->
    <div id="loginModal"
        class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-md p-4">
        <div
            class="white-panel p-5 sm:p-8 rounded-2xl max-w-sm sm:max-w-md w-full border border-slate-200 shadow-xl relative">
            <div class="text-center mb-5">
                <img class="mx-auto mb-2.5 max-w-[100px] sm:max-w-[120px]"
                    src="//www.loomsolar.com/cdn/shop/files/Loom_logo_f50a89a5-291b-4c15-9a87-303dc061554e_140x@2x.png?v=1752208604"
                    alt="LOOM SOLAR">
                <h2 class="text-base sm:text-xl font-extrabold text-slate-800">Govt Tracking Portal</h2>
                <p class="text-[11px] sm:text-xs text-slate-500 font-semibold mt-0.5">Enter Passcode to Access</p>
            </div>
            <div class="space-y-3">
                <div>
                    <label
                        class="block text-[10px] sm:text-xs font-bold text-slate-600 mb-1 uppercase tracking-wider">Passcode</label>
                    <input type="password" id="passcodeInput" placeholder="Enter Passcode (e.g. NAME0012)"
                        onkeypress="if(event.key === 'Enter') handleLogin()"
                        class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 font-semibold">
                </div>
                <button onclick="handleLogin()" id="loginBtn"
                    class="w-full py-2.5 sm:py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs sm:text-sm transition-all shadow-md shadow-emerald-600/20">
                    Login to Portal
                </button>
                <div id="loginError" class="hidden text-center text-xs font-semibold text-rose-500 mt-2"></div>
            </div>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div id="mainApp"
        class="hidden relative z-10 max-w-7xl mx-auto px-2.5 sm:px-6 lg:px-8 py-3 sm:py-6 space-y-3 sm:space-y-6 w-full overflow-hidden">

        <!-- Top Header Navigation -->
        <header class="white-panel p-3 sm:p-5 rounded-2xl">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2.5 sm:space-x-4">
                    <img class="header__logo-image max-w-[90px] sm:max-w-[130px]"
                        src="//www.loomsolar.com/cdn/shop/files/Loom_logo_f50a89a5-291b-4c15-9a87-303dc061554e_140x@2x.png?v=1752208604"
                        alt="LOOM SOLAR">
                    <div>
                        <h1
                            class="text-sm sm:text-xl font-extrabold tracking-tight text-slate-900 flex items-center gap-1.5">
                            Govt Portal
                            <span id="roleBadge"
                                class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[9px] sm:text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                                Live
                            </span>
                        </h1>
                        <p id="userGreeting"
                            class="text-[10px] sm:text-xs text-slate-500 font-semibold truncate max-w-[130px] sm:max-w-none">
                            Welcome</p>
                    </div>
                </div>

                <!-- Desktop Action Buttons -->
                <div class="hidden sm:flex items-center gap-3">
                    <div class="flex items-center gap-2 bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-100">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 live-dot"></span>
                        <span id="syncStatus" class="text-xs font-semibold text-emerald-800">Auto-sync Active</span>
                    </div>
                    <button onclick="fetchLeads()"
                        class="p-2 rounded-xl bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 shadow-sm">
                        <i data-lucide="refresh-cw" id="refreshIcon" class="w-4 h-4"></i>
                    </button>
                    <button onclick="logout()"
                        class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold text-xs border border-slate-200 shadow-sm">
                        Logout
                    </button>
                </div>

                <!-- Mobile Hamburger Button -->
                <button onclick="toggleMobileMenu()"
                    class="sm:hidden p-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 focus:outline-none">
                    <i data-lucide="menu" id="menuIcon" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Mobile Menu Dropdown -->
            <div id="mobileMenu" class="hidden sm:hidden pt-3 mt-3 border-t border-slate-100 space-y-2">
                <div
                    class="flex items-center justify-between bg-emerald-50/80 p-2 rounded-lg border border-emerald-100">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 live-dot"></span>
                        <span class="text-[11px] font-semibold text-emerald-800">Auto-sync Active</span>
                    </div>
                    <button onclick="fetchLeads()" class="p-1 rounded bg-white text-slate-600 border border-slate-200">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
                <button onclick="logout()"
                    class="w-full text-left py-2 px-3 rounded-lg bg-rose-50 text-rose-600 font-semibold text-xs border border-rose-100 flex items-center justify-between">
                    <span>Logout</span>
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                </button>
            </div>
        </header>

        <!-- Metric Cards Grid -->
        <div class="grid grid-cols-3 gap-2 sm:gap-6">
            <div
                class="white-panel p-2.5 sm:p-5 rounded-xl sm:rounded-2xl border-l-2 sm:border-l-4 border-l-emerald-600">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center">
                    <div>
                        <p class="text-[9px] sm:text-xs font-bold uppercase tracking-wider text-slate-400">Total</p>
                        <h2 id="totalCount" class="text-lg sm:text-3xl font-extrabold text-slate-900 mt-0.5 sm:mt-1">0
                        </h2>
                    </div>
                    <div
                        class="hidden sm:block p-2 bg-emerald-50 rounded-lg text-emerald-600 border border-emerald-100">
                        <i data-lucide="file-text" class="w-5 h-5"></i>
                    </div>
                </div>
            </div>

            <div class="white-panel p-2.5 sm:p-5 rounded-xl sm:rounded-2xl border-l-2 sm:border-l-4 border-l-amber-500">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center">
                    <div>
                        <p class="text-[9px] sm:text-xs font-bold uppercase tracking-wider text-slate-400">Pending</p>
                        <h2 id="pendingCount" class="text-lg sm:text-3xl font-extrabold text-amber-600 mt-0.5 sm:mt-1">0
                        </h2>
                    </div>
                    <div class="hidden sm:block p-2 bg-amber-50 rounded-lg text-amber-600 border border-amber-100">
                        <i data-lucide="clock" class="w-5 h-5"></i>
                    </div>
                </div>
            </div>

            <div class="white-panel p-2.5 sm:p-5 rounded-xl sm:rounded-2xl border-l-2 sm:border-l-4 border-l-blue-600">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center">
                    <div>
                        <p class="text-[9px] sm:text-xs font-bold uppercase tracking-wider text-slate-400">Done</p>
                        <h2 id="completedCount" class="text-lg sm:text-3xl font-extrabold text-blue-600 mt-0.5 sm:mt-1">
                            0</h2>
                    </div>
                    <div class="hidden sm:block p-2 bg-blue-50 rounded-lg text-blue-600 border border-blue-100">
                        <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- ⬇️ ASM Breakdown & Filter View ⬇️ -->
        <div id="asmFilterContainer" class="hidden white-panel p-3 sm:p-5 rounded-xl sm:rounded-2xl space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-xs sm:text-sm font-extrabold text-slate-800 flex items-center gap-1.5">
                    <i data-lucide="users" class="w-4 h-4 text-emerald-600"></i> ASM Visit Assignment Overview
                </h2>
                <span id="asmCountBadge"
                    class="text-[10px] sm:text-xs font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">0
                    ASMs</span>
            </div>

            <!-- Dynamic ASM Cards Grid -->
            <div id="asmGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2 sm:gap-3">
            </div>
        </div>

        <!-- Data Container -->
        <div class="white-panel rounded-xl sm:rounded-2xl overflow-hidden border border-slate-200/80">
            <div
                class="p-3 sm:p-5 border-b border-slate-200/80 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 bg-white/60">
                <div class="flex items-center gap-2">
                    <div class="p-1.5 bg-emerald-50 rounded-md text-emerald-600 border border-emerald-100">
                        <i data-lucide="layers" class="w-4 h-4"></i>
                    </div>
                    <h2 id="tableTitle" class="text-sm sm:text-base font-bold text-slate-800">Assigned Leads</h2>
                </div>

                <div class="relative w-full sm:max-w-xs">
                    <i data-lucide="search"
                        class="w-3.5 h-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Instant Search..."
                        class="w-full bg-white border border-slate-200 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-emerald-500 shadow-sm">
                </div>
            </div>

            <!-- Mobile Compact Card List -->
            <div id="mobileLeadList" class="block sm:hidden divide-y divide-slate-100 bg-white/40">
            </div>

            <!-- Desktop Table View -->
            <div class="hidden sm:block overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr
                            class="bg-slate-50/80 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
                            <th class="py-3 px-4">Tender ID</th>
                            <th class="py-3 px-4">Vendor Name</th>
                            <th class="py-3 px-4">Location</th>
                            <th class="py-3 px-4">Document</th>
                            <th class="py-3 px-4">Assigned ASM</th>
                            <th class="py-3 px-4 min-w-[140px]">Status</th>
                            <th class="py-3 px-4 min-w-[200px]">Remarks</th>
                            <th class="py-3 px-4 text-center min-w-[100px]">Action</th>
                        </tr>
                    </thead>
                    <tbody id="leadTable" class="divide-y divide-slate-100 text-xs bg-white/40">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast"
        class="fixed bottom-3 left-3 right-3 sm:left-auto sm:right-6 translate-y-24 opacity-0 transition-all duration-300 ease-out flex items-center justify-center gap-2 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-xl z-50">
        <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400 shrink-0"></i>
        <span id="toastMsg" class="font-medium text-xs">Updated successfully!</span>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzwsHwj9LXIzDOoHoOGWauq7Le45sPjJ8tj_hrTsgf1J_N5KUPyf6u_Y5FhG7rp_cxK/exec";

        let leads = [];
        let activeASM = "ALL";
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            let savedUser = localStorage.getItem('loom_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                initDashboard();
            }

            document.getElementById('searchInput')?.addEventListener('input', (e) => {
                instantDOMFilter(e.target.value);
            });
        });

        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        }

        async function handleLogin() {
            const code = document.getElementById('passcodeInput').value.trim();
            const err = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            if (!code) {
                err.innerText = "Please enter passcode";
                err.classList.remove('hidden');
                return;
            }

            btn.innerText = "Verifying...";
            btn.disabled = true;
            err.classList.add('hidden');

            try {
                let res = await fetch(`${API_URL}?action=verifyPasscode&code=${encodeURIComponent(code)}`);
                let data = await res.json();

                if (data.success) {
                    currentUser = data;
                    localStorage.setItem('loom_user', JSON.stringify(data));
                    initDashboard();
                } else {
                    err.innerText = data.message || "Invalid Passcode!";
                    err.classList.remove('hidden');
                }
            } catch (e) {
                err.innerText = "Connection error. Try again.";
                err.classList.remove('hidden');
            } finally {
                btn.innerText = "Login to Portal";
                btn.disabled = false;
            }
        }

        function initDashboard() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');

            document.getElementById('userGreeting').innerText = `${currentUser.asmName}`;
            document.getElementById('roleBadge').innerText = currentUser.role === 'ADMIN' ? 'Admin' : 'ASM';

            const asmContainer = document.getElementById('asmFilterContainer');
            if (currentUser.role === 'ADMIN') {
                if (asmContainer) asmContainer.classList.remove('hidden');
            } else {
                if (asmContainer) asmContainer.classList.add('hidden');
                activeASM = currentUser.asmName;
            }

            fetchLeads();
        }

        function logout() {
            localStorage.removeItem('loom_user');
            location.reload();
        }

        async function fetchLeads() {
            const refreshIcon = document.getElementById('refreshIcon');
            if (refreshIcon) refreshIcon.classList.add('animate-spin');

            try {
                let res = await fetch(API_URL);
                leads = await res.json();
                renderMetrics();
                if (currentUser.role === 'ADMIN') {
                    renderASMCards();
                }
                renderTable();
            } catch (error) {
                showToast("Failed to fetch data", "error");
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('animate-spin');
            }
        }

        function getFilteredUserLeads() {
            if (currentUser.role === 'ADMIN') {
                return leads;
            }
            return leads.filter(l => l.assignedASM && l.assignedASM.toLowerCase() === currentUser.asmName.toLowerCase());
        }

        function renderMetrics() {
            let userLeads = getFilteredUserLeads();
            document.getElementById('totalCount').innerText = userLeads.length;
            document.getElementById('pendingCount').innerText = userLeads.filter(l => l.status === 'Pending').length;
            document.getElementById('completedCount').innerText = userLeads.filter(l => l.status === 'Completed').length;
        }

        // Render ASM Wise Summary Cards for Admin View
        function renderASMCards() {
            const grid = document.getElementById('asmGrid');
            if (!grid) return;

            const asmStats = {};
            leads.forEach(l => {
                const asm = l.assignedASM || 'Unassigned';
                if (!asmStats[asm]) {
                    asmStats[asm] = { total: 0, pending: 0, completed: 0 };
                }
                asmStats[asm].total += 1;
                if (l.status === 'Completed') asmStats[asm].completed += 1;
                else asmStats[asm].pending += 1;
            });

            const asmNames = Object.keys(asmStats).sort();
            document.getElementById('asmCountBadge').innerText = `${asmNames.length} ASMs`;

            let html = `
                <div onclick="filterByASM('ALL')" class="cursor-pointer p-2.5 rounded-xl border transition-all ${activeASM === 'ALL' ? 'bg-emerald-600 text-white border-emerald-600 shadow-md' : 'bg-white hover:bg-slate-50 border-slate-200 text-slate-800'}">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-xs font-bold truncate">All ASMs</span>
                        <span class="text-[10px] font-extrabold px-1.5 py-0.2 rounded ${activeASM === 'ALL' ? 'bg-emerald-700 text-white' : 'bg-slate-100 text-slate-600'}">${leads.length}</span>
                    </div>
                    <p class="text-[10px] opacity-80 font-medium">Click to show all</p>
                </div>
            `;

            asmNames.forEach(asm => {
                const stat = asmStats[asm];
                const isActive = activeASM === asm;
                html += `
                    <div onclick="filterByASM('${asm}')" class="cursor-pointer p-2.5 rounded-xl border transition-all ${isActive ? 'bg-emerald-600 text-white border-emerald-600 shadow-md' : 'bg-white hover:bg-slate-50 border-slate-200 text-slate-800'}">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold truncate max-w-[90px]" title="${asm}">${asm}</span>
                            <span class="text-[10px] font-extrabold px-1.5 py-0.2 rounded ${isActive ? 'bg-emerald-700 text-white' : 'bg-emerald-50 text-emerald-700'}">${stat.total}</span>
                        </div>
                        <div class="flex justify-between text-[10px] opacity-90 font-semibold mt-1">
                            <span>⏳ ${stat.pending}</span>
                            <span>✅ ${stat.completed}</span>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        function filterByASM(asmName) {
            activeASM = asmName;
            document.getElementById('tableTitle').innerText = asmName === 'ALL' ? 'Assigned Leads' : `Assigned Leads - ${asmName}`;
            renderASMCards();
            renderTable();
        }

        function renderTable() {
            if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT')) return;
            let baseLeads = getFilteredUserLeads();

            let filtered = baseLeads;
            if (currentUser.role === 'ADMIN' && activeASM !== 'ALL') {
                filtered = baseLeads.filter(l => l.assignedASM === activeASM);
            }

            if (filtered.length === 0) {
                const emptyStateHtml = `
                    <div class="py-8 text-center text-slate-400 font-medium text-xs">
                        <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-1.5 opacity-40"></i>
                        No matching leads
                    </div>`;

                document.getElementById('mobileLeadList').innerHTML = emptyStateHtml;
                document.getElementById('leadTable').innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center py-8 text-slate-400 font-medium">
                            <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-1.5 opacity-40"></i>
                            No matching leads
                        </td>
                    </tr>`;
                lucide.createIcons();
                return;
            }

            let desktopHtml = "";
            let mobileHtml = "";

            filtered.forEach(lead => {
                const searchDataAttr = `${lead.tenderId || ''} ${lead.vendorName || ''} ${lead.district || ''} ${lead.state || ''} ${lead.assignedASM || ''}`.toLowerCase();

                // Desktop Table Row
                desktopHtml += `
                <tr class="lead-item hover:bg-slate-50/80 transition-colors" data-search="${searchDataAttr}">
                    <td class="py-3 px-4 font-mono font-semibold text-slate-700">${lead.tenderId || '-'}</td>
                    <td class="py-3 px-4 font-semibold text-slate-800">${lead.vendorName || '-'}</td>
                    <td class="py-3 px-4 text-slate-500 font-medium">${lead.district || ''}${lead.district && lead.state ? ', ' : ''}${lead.state || ''}</td>
                    <td class="py-3 px-4">
                        ${lead.docLink ?
                        `<a href="${lead.docLink}" target="_blank" class="inline-flex items-center gap-1 text-emerald-600 font-semibold hover:underline">
                                <i data-lucide="external-link" class="w-3 h-3"></i> Link
                             </a>` : '<span class="text-slate-300">-</span>'}
                    </td>
                    <td class="py-3 px-4">
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-slate-100 text-[11px] font-medium text-slate-700">
                            ${lead.assignedASM || 'Unassigned'}
                        </span>
                    </td>
                    <td class="py-3 px-4">
                        <select id="status_${lead.rowId}" class="bg-white border border-slate-200 text-slate-700 text-xs rounded-lg p-1.5 font-medium focus:ring-1 focus:ring-emerald-500 w-full">
                            <option value="Pending" ${lead.status === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
                            <option value="In Progress" ${lead.status === 'In Progress' ? 'selected' : ''}>🔄 In Progress</option>
                            <option value="Completed" ${lead.status === 'Completed' ? 'selected' : ''}>✅ Completed</option>
                        </select>
                    </td>
                    <td class="py-3 px-4">
                        <input type="text" id="remark_${lead.rowId}" value="${lead.remarks || ''}" placeholder="Type updates..." 
                               class="bg-white border border-slate-200 text-slate-800 text-xs rounded-lg px-2.5 py-1.5 w-full placeholder-slate-400 font-medium focus:ring-1 focus:ring-emerald-500">
                    </td>
                    <td class="py-3 px-4 text-center">
                        <button id="btn_${lead.rowId}" onclick="saveStatus(${lead.rowId})" 
                                class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-3 py-1.5 rounded-lg text-xs shadow-sm active:scale-95 transition-all inline-flex items-center justify-center gap-1 w-full">
                            <i data-lucide="check" class="w-3 h-3"></i> Save
                        </button>
                    </td>
                </tr>`;

                // Compact Mobile Card View
                mobileHtml += `
                <div class="lead-item p-3 space-y-2.5 bg-white/60" data-search="${searchDataAttr}">
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-[10px] font-mono font-bold text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100 uppercase">
                            #${lead.tenderId || '-'}
                        </span>
                        <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-slate-100 text-[10px] font-medium text-slate-600 truncate max-w-[120px]">
                            <i data-lucide="user" class="w-2.5 h-2.5 text-slate-400 shrink-0"></i> ${lead.assignedASM || 'Unassigned'}
                        </span>
                    </div>

                    <div>
                        <h3 class="font-bold text-slate-900 text-xs leading-tight">${lead.vendorName || '-'}</h3>
                        <div class="flex items-center justify-between text-[11px] text-slate-500 mt-1">
                            <span class="truncate max-w-[180px]">${lead.district || ''}${lead.district && lead.state ? ', ' : ''}${lead.state || ''}</span>
                            ${lead.docLink ?
                        `<a href="${lead.docLink}" target="_blank" class="text-emerald-600 font-semibold text-[10px] flex items-center gap-0.5 shrink-0">
                                <i data-lucide="external-link" class="w-2.5 h-2.5"></i> Doc
                            </a>` : ''}
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <div>
                            <select id="mobile_status_${lead.rowId}" onchange="syncMobileDesktopInput('${lead.rowId}', 'status')" class="bg-white border border-slate-200 text-slate-700 text-[11px] rounded-lg p-1.5 font-medium focus:ring-1 focus:ring-emerald-500 w-full">
                                <option value="Pending" ${lead.status === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
                                <option value="In Progress" ${lead.status === 'In Progress' ? 'selected' : ''}>🔄 In Progress</option>
                                <option value="Completed" ${lead.status === 'Completed' ? 'selected' : ''}>✅ Completed</option>
                            </select>
                        </div>
                        <button id="mobile_btn_${lead.rowId}" onclick="saveStatus(${lead.rowId})" 
                                class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-1.5 px-2 rounded-lg text-xs shadow-sm active:scale-95 transition-all flex items-center justify-center gap-1">
                            <i data-lucide="check" class="w-3 h-3"></i> Save
                        </button>
                    </div>

                    <div>
                        <input type="text" id="mobile_remark_${lead.rowId}" oninput="syncMobileDesktopInput('${lead.rowId}', 'remark')" value="${lead.remarks || ''}" placeholder="Remarks..." 
                               class="bg-white border border-slate-200 text-slate-800 text-[11px] rounded-lg px-2 py-1.5 w-full placeholder-slate-400 font-medium focus:ring-1 focus:ring-emerald-500">
                    </div>
                </div>`;
            });

            document.getElementById('leadTable').innerHTML = desktopHtml;
            document.getElementById('mobileLeadList').innerHTML = mobileHtml;
            lucide.createIcons();

            const curSearch = document.getElementById('searchInput')?.value || '';
            if (curSearch) instantDOMFilter(curSearch);
        }

        function instantDOMFilter(query) {
            const filterText = query.toLowerCase().trim();
            const items = document.querySelectorAll('.lead-item');

            items.forEach(item => {
                const searchContent = item.getAttribute('data-search') || '';
                if (searchContent.includes(filterText)) {
                    item.style.display = "";
                } else {
                    item.style.display = "none";
                }
            });
        }

        function syncMobileDesktopInput(rowId, type) {
            if (type === 'status') {
                const mobVal = document.getElementById(`mobile_status_${rowId}`)?.value;
                const dsk = document.getElementById(`status_${rowId}`);
                if (dsk && mobVal) dsk.value = mobVal;
            } else if (type === 'remark') {
                const mobVal = document.getElementById(`mobile_remark_${rowId}`)?.value;
                const dsk = document.getElementById(`remark_${rowId}`);
                if (dsk && mobVal !== undefined) dsk.value = mobVal;
            }
        }

        async function saveStatus(rowId) {
            let statusVal = document.getElementById(`status_${rowId}`)?.value || document.getElementById(`mobile_status_${rowId}`)?.value;
            let remarkVal = document.getElementById(`remark_${rowId}`)?.value || document.getElementById(`mobile_remark_${rowId}`)?.value;

            let btn = document.getElementById(`btn_${rowId}`);
            let mobileBtn = document.getElementById(`mobile_btn_${rowId}`);

            const setBtnState = (isSaving) => {
                const elements = [btn, mobileBtn].filter(Boolean);
                elements.forEach(b => {
                    b.disabled = isSaving;
                    if (isSaving) {
                        b.className = "bg-slate-400 text-white font-semibold px-2 py-1.5 rounded-lg text-xs cursor-not-allowed flex items-center justify-center gap-1 w-full";
                        b.innerHTML = `<i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i> Saving`;
                    } else {
                        b.className = "bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-2 py-1.5 rounded-lg text-xs shadow-sm active:scale-95 transition-all flex items-center justify-center gap-1 w-full";
                        b.innerHTML = `<i data-lucide="check" class="w-3 h-3"></i> Save`;
                    }
                });
                lucide.createIcons();
            };

            setBtnState(true);

            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ rowId: rowId, status: statusVal, remarks: remarkVal })
                });

                showToast("Updated successfully!");
                fetchLeads();
            } catch (error) {
                showToast("Failed to save", "error");
                setBtnState(false);
            }
        }

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');

            toastMsg.innerText = message;
            toast.className = `fixed bottom-3 left-3 right-3 sm:left-auto sm:right-6 flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl shadow-xl z-50 transition-all duration-300 ${type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white'}`;

            toast.classList.remove('translate-y-24', 'opacity-0');

            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }

        setInterval(fetchLeads, 15000);
    </script>
</body>

</html>
